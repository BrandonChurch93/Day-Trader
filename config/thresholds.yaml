  source: timemachine/tm06.py
tm06_swing_max_gross:
  value: 1
  status: builder
  note: Plan TM06 part S. Swing sessions are long or flat with the weights adding up to at most this. The book allows signed weights; the session flag long_only refuses a negative one.
  source: timemachine/tm06.py
tm06_carry_multiples:
  value: [2, 3]
  status: builder
  note: Plan TM06 item 6. A finished swing session's weights, and its yardsticks', are replayed multiplied by each of these, with funding and forced close-out, at each fee in tm_perp_fee_levels_bps.
  source: timemachine/tm06.py
tm06_reversal:
  value: {symbol: BTC/USD, minutes: 15, move_pct: 0.5, multiples: [1, 3]}
  status: builder
  note: Plan TM06 negative control, a code trader with no model. Every minutes minutes on symbol, if the last finished bar of that length moved more than move_pct percent from open to close, hold the other side (weight minus or plus 1) until the next wake, else flat. Replayed at each multiple and at each fee in tm_perp_fee_levels_bps. move_pct is a builder choice, set before any run.
  source: timemachine/tm06.py
