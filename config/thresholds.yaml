# Every project threshold and every owner number, once.
# Documents name the key. They never repeat the value.
#
# status:
#   owner    the owner's own words, with the date
#   builder  set by the builder for testing and pretend money; the builder may change it before
#            a test runs, never after seeing that test's result
#   open     a real-money number with no value yet; nothing may assume one

