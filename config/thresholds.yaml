# Practice trader 01 (practice/trader.py). Pretend money only. Set for the build the owner
# approved on 2026-11-25 (archive/decisions/0007-owner-goal-and-practice-trader-2026-11-25.md).

practice_amount_per_trader_usd:
  value: 1000
  status: builder
  note: Pretend dollars given to each trader on the practice desk, fixed rule or AI. Not a real-money number. The same for every trader so they can be compared.
  source: practice/README.md

practice_max_order_usd:
  value: 2000
  status: builder
  note: The practice desk refuses to send any single order larger than this, in pretend dollars.
  source: practice/README.md

practice_min_order_usd:
  value: 1
  status: builder
  note: The practice desk refuses to send an order smaller than this, in pretend dollars. Alpaca says fractional buys start at one dollar.
  source: https://docs.alpaca.markets/us/docs/fractional-trading.md

practice_max_orders_per_trader_per_day:
  value: 20
  status: builder
  note: The practice desk refuses to send more orders than this for one trader in one day (UTC). Counted from the broker's own order list.
  source: practice/README.md

practice_rebalance_band:
  value: 0.10
  status: builder
  note: A fixed rule's holding is changed only on a full move in or out, or when the share it wants differs from the share it has by more than this. Same band as the replays used (research_rig/engine.py).
  source: research_rig/PREREG_01_daily_crypto_trend.md

practice_crypto_fee_bps_added:
  value: 25
  status: builder
  note: Fee per crypto fill, in basis points, that the practice desk counts in its books. Alpaca's published taker fee at its lowest volume tier. Whether the practice account charges it itself is UNKNOWN until the first fill is read.
  source: https://docs.alpaca.markets/us/docs/crypto-fees.md

practice_crypto_fee_in_coin:
  value: 0
  status: builder
  note: 1 if the practice account takes the fee on a crypto buy out of the coins bought, 0 if the books count it in dollars. Alpaca says live accounts take it in coin. UNKNOWN for the practice account until the first fill is read, then set here.
  source: https://docs.alpaca.markets/us/docs/crypto-fees.md

practice_max_price_age_hours_crypto:
  value: 30
  status: builder
  note: A fixed crypto rule decides nothing if the newest finished day in its daily prices ended more than this many hours ago.
  source: practice/README.md

practice_max_price_age_days_stock:
  value: 5
  status: builder
  note: A fixed stock rule decides nothing if its newest daily price is more than this many days old.
  source: practice/README.md

practice_max_quote_age_minutes:
  value: 20
  status: builder
  note: No order is sent for a symbol whose newest price was read from a trade or quote older than this many minutes.
  source: practice/README.md

practice_fill_wait_seconds:
  value: 60
  status: builder
  note: How long one run waits for its orders to fill before leaving them to be read on the next run.
  source: practice/README.md

practice_qty_tolerance:
  value: 0.01
  status: builder
  note: How far, as a share, the account's holding of a symbol may differ from the sum of the traders' books before trading in that symbol stops. Wide enough for a fee taken in coin.
  source: practice/README.md

practice_open_order_max_hours:
  value: 6
  status: builder
  note: An order still open after this many hours raises an alarm. The desk cannot cancel orders.
  source: practice/README.md

practice_unread_runs_before_alarm:
  value: 3
  status: builder
  note: The run ends with an error when the broker could not be reached this many runs in a row.
  source: practice/README.md

practice_pick_max_life_hours:
  value: 24
  status: builder
  note: The longest an AI trader's pick may stay valid. Anything in it not traded by then is dropped.
  source: practice/picks.py

practice_pick_max_actions:
  value: 10
  status: builder
  note: The most buys and sells one pick may hold.
  source: practice/picks.py

practice_timer_minutes:
  value: 10
  status: builder
  note: How often GitHub's timer runs the practice desk. The schedule line in the workflow has to match it by hand. GitHub can run late. It was 30 from 16:34 to 16:40 UTC on 2026-11-25 while the repo was private, because a private repo on the free plan gets about 2,000 runner minutes a month and each run is billed as one minute. If the repo is made private again, set this and the schedule line back to 30.
