moonshot_sleeve_share:
  value: null
  status: open
  recommended: 0.10
  note: Share of the trading account. Suggested range was 0.05 to 0.10.

moonshot_max_position_share:
  value: null
  status: open
  recommended: 0.02
  note: Share of the trading account in one moonshot.

api_model_spend_cap_usd_month:
  value: null
  status: open
  recommended: 25
  note: Hard cap on API-billed model spend by the running service. The working is in docs/playbook/05_perplexity_and_costs.md.
