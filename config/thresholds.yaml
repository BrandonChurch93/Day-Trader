tm_weights_sum_tolerance:
  value: 0.000001
  status: builder
  note: In a weights session, the answered weights may add up to at most 1 plus this, to allow for rounding in the trader's numbers.
  source: timemachine/weights.py
tm_weights_return_days:
  value: [1, 7, 30, 91]
  status: builder
  note: Calendar days for the trailing returns in a weights packet (about 1 day, 1 week, 1 month, 3 months), worked out from closed 1Day bars only.
  source: timemachine/weights.py
tm_weights_weekly_weekday:
  value: 4
  status: builder
  note: Weekday of the weekly wake in a weights session, Monday is 0 (4 is Friday). For stocks, if that day has no session the last session day before it in the same week is used.
  source: timemachine/weights.py
tm_weights_weekly_time_ny:
  value: 15.5
  status: builder
  note: New York time of the weekly wake in a weights session, in hours (15.5 is 15:30).
  source: timemachine/weights.py
tm_weights_max_headlines_per_symbol:
  value: 40
  status: builder
  note: In a weights packet with news, at most this many headlines per allowed symbol since the last wake (newest first); SEC filings are always all shown, and the packet counts what was left out. MEASURED 2026-11-25 on the tape - the 38 stocks of tm04_plan get a median of about 400 items a week, BTC/USD a median of 14 a day.
  source: timemachine/weights.py
tm_weights_news_first_wake_hours:
  value: 24
  status: builder
  note: At the first wake of a weights session with news, headlines from this many hours before the wake are shown.
  source: timemachine/weights.py
tm_weights_why_max_chars:
  value: 2000
  status: builder
  note: Longest "why" text a weights answer may carry.
  source: timemachine/weights.py
tm_weights_twin_seed:
  value: 1
  status: builder
  note: Seed for the random twins in timemachine/score_weights.py. Draw i uses its own generator made from this seed, the twin kind and i.
  source: timemachine/score_weights.py
tm_adds_drops_before_weeks:
  value: 4
  status: builder
  note: Adds and drops (after the fact, not judged) in timemachine/score_tm04.py - an added stock's return is measured over this many weekly wakes before it was added.
  source: timemachine/score_tm04.py
tm_adds_drops_after_weeks:
  value: [1, 4, 8]
  status: builder
  note: Adds and drops (after the fact, not judged) - a dropped stock's return is measured over these numbers of weekly wakes after it was dropped, and to the end of the window.
  source: timemachine/score_tm04.py
tm_adds_drops_chance_pct:
  value: 5
  status: builder
  note: Adds and drops (after the fact, not judged) - a model's mean is said to be beyond chance when fewer than this percent of random swaps reach it on that side. A reading aid, not a mark.
  source: timemachine/score_tm04.py
tm_lev_fixed_rate_per_day:
  value: 0.0002
  status: builder
  note: Leverage only. Financing per day on borrowed dollars when no stored funding covers the symbol or the hour (stocks always). About 7.3 percent a year, near a broker's margin rate for a small account. Charged a 24th at each whole UTC hour.
  source: timemachine/weights.py
tm_lev_maintenance_crypto:
  value: 0.05
  status: builder
  note: Leverage only, crypto. If on any recorded minute the account value is below this share of gross position value (at the minute's low), the book is closed out. At 5x the account starts at 0.2, so a fall of about 16 percent closes it.
  source: timemachine/weights.py
tm_lev_maintenance_stocks:
  value: 0.25
  status: builder
  note: Leverage only, stocks. The same rule at the usual 25 percent stock margin minimum. At 2x a fall of about a third closes it; above 4x a stock book would be closed at once.
  source: timemachine/weights.py
tm_lev_closeout_penalty:
  value: 0.01
  status: builder
  note: Leverage only. A forced close-out sells at the minute's low less the half spread and fee, and less this share of what is sold, as a liquidation fee.
  source: timemachine/weights.py
tm_lev_funding_files:
  value: {BTC/USD: rig/data/funding/kraken_PF_XBTUSD.json, ETH/USD: rig/data/funding/kraken_PF_ETHUSD.json}
  status: builder
  note: Leverage only, crypto. Stored hourly perpetual funding (Kraken, relativeFundingRate per hour, positive means longs pay) used as the hourly financing rate on borrowed dollars for these symbols; paths under the workspace. A negative rate is paid to the account. Hours not in the file use tm_lev_fixed_rate_per_day.
  source: timemachine/weights.py
tm_lev_replay_multiples:
  value: [2, 3, 5]
  status: builder
  note: timemachine/leverage_replay_tm03.py only, looked at after the fact. Each stored TM03 answer, holding, and dials B and C are replayed at these multiples (and at 1x as the check).
  source: timemachine/leverage_replay_tm03.py
tm_lev_replay_low_share:
  value: 0.5
  status: builder
  note: timemachine/leverage_replay_tm03.py only. A month counts as ended low when its final value is below this share of tm_account_start_usd.
  source: timemachine/leverage_replay_tm03.py
tm_perp_fee_bps_per_side:
  value: {default: 12}
  status: builder
  note: Perp sessions only. Fee per fill on the notional traded, in basis points, by symbol, with default for any symbol not named, used when a perp session runs. 12 is the main line of tm_perp_fee_levels_bps; every perp result is also scored at each of those levels (see docs/research/40_leverage_venues_checked.md). Separate from practice_crypto_fee_bps_added, which spot sessions keep.
  source: timemachine/perp.py
tm_perp_fee_levels_bps:
  value: [1, 12, 25]
  status: builder
  note: Perp sessions only. The three fees per side, in basis points, at which every leveraged result is scored, fixed 2026-11-25 before any perp session ran. 1 is Robinhood's posted rate, 12 is Kalshi's entry taker rate charged to brokers, 25 is Kraken's fractional futures rate. The middle one is the main line.
  source: docs/research/40_leverage_venues_checked.md

tm_perp_half_spread_bps:
  value: {default: 10}
  status: builder
  note: Perp sessions only. Half the assumed bid-ask spread on a perp fill, in basis points. A symbol named here uses its own value; otherwise its coin's measured value in tm_crypto_half_spread_bps_by_coin; otherwise default. A buy fills this much above the price and a sell this much below.
  source: timemachine/perp.py
tm_perp_maintenance:
  value: {default: 0.05}
  status: builder
  note: Perp sessions only. Maintenance share of position value, by symbol, with default. If on any recorded minute the account value is below the sum over positions of this share times position value (each symbol at its worst price of that minute), the whole book is closed out. An assumption; small coins on real venues often need more.
  source: timemachine/perp.py
tm_perp_closeout_penalty:
  value: 0.01
  status: builder
  note: Perp sessions only. A forced close-out pays this share of the notional closed as a liquidation fee, on top of the half spread and the fee. Kept apart from tm_lev_closeout_penalty so spot-margin sessions are unchanged by it.
  source: timemachine/perp.py
tm_perp_funding_files:
  value: {BTC/USD: rig/data/funding/kraken_PF_XBTUSD.json, ETH/USD: rig/data/funding/kraken_PF_ETHUSD.json}
  status: builder
  note: Perp sessions only. Stored hourly perpetual funding (Kraken, relativeFundingRate per hour, positive means longs pay) for these symbols; paths under the workspace. Charged on the whole position value. Kept apart from tm_lev_funding_files so spot-margin sessions are unchanged.
  source: timemachine/perp.py
tm_perp_funding_hours:
  value: {default: 1}
  status: builder
  note: Perp sessions only. Hours between funding charges, by symbol, with default; 1 or 8, since venues differ. Charges fall on whole multiples of this many hours in UTC. With a stored hourly file and 8 hours, one charge is the sum of the 8 stored hourly rates ending at it.
  source: timemachine/perp.py
tm_perp_fallback_rate_per_day:
  value: 0.0003
  status: builder
  note: Perp sessions only. Funding per day, as a share of position value, for a symbol or charge the stored files do not cover; paid by longs and shorts alike, so a made-up rate never pays a short. 0.0003 is the common 0.01 percent per 8 hours base rate. The scan counts the hours charged this way.
  source: timemachine/perp.py
tm_perp_min_change:
  value: 0.02
  status: builder
  note: Perp sessions only. A symbol whose signed weight would move by less than this is not traded. A move to zero and a change of side are always traded.
  source: timemachine/perp.py
tm_perp_packet_bars:
  value: 12
  status: builder
  note: Perp sessions only. How many of the latest bars per symbol the packet shows, at the session's wake spacing (15 minute, 1 hour, 4 hour or 1 day bars). More are a lookup.
  source: timemachine/perp.py
tm_crypto_half_spread_bps_default:
  value: 25
  status: builder
  note: PLACEHOLDER until measured. Half spread in basis points for a coin that tm_crypto_half_spread_bps_by_coin does not name, on perp sessions. In order, a symbol named in tm_perp_half_spread_bps, else its coin in tm_crypto_half_spread_bps_by_coin, else this key, else the tm_perp_half_spread_bps default. Sessions made before this key existed keep the old order. Set at the upper middle of the measured coins; the helper measuring the fast tape coins will replace it.
  source: timemachine/perp.py
tm_fast_funding_venue:
  value: {default: kraken_futures_pf}
  status: builder
  note: Perp sessions on the fast tape only. Which venue in the fast tape's funding table charges each coin, with default for any coin not named. kraken_futures_pf has hourly rates for all 23 coins from 2025-11-19; kalshi_perp (8 hourly) starts in mid 2026 and lacks some coins. A charge time with no stored rate at or before it, inside its interval, pays tm_perp_fallback_rate_per_day and is counted.
  source: timemachine/tm06.py
tm_fast_oi_venue:
  value: {default: kraken_futures_pf}
  status: builder
  note: Fast tape only. Which venue's open interest the packet shows per coin. Open interest is a packet figure only; it never moves the book.
  source: timemachine/tm06.py
tm_fast_oi_known_after_hours:
  value: 1
  status: builder
  note: Fast tape only. An open interest row stamped t is treated as known only from t plus this many hours, because the table does not say whether t starts or ends the hour. Assumed, to stay on the safe side.
  source: timemachine/tm06.py
tm06_pick_max_names:
