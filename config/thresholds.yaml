  source: timemachine/tm06.py
tm06_pick_attention_days:
  value: 8
  status: builder
  note: Plan TM06 part P. Days of daily attention counts per coin and source shown in the packet, from timemachine/attention.py as known at the wake.
  source: timemachine/tm06.py
tm06_attention_rule:
  value: {source: wikipedia_daily, before_days: 7, lookback_days: 11}
